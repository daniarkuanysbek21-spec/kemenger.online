<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ панель — Kemenger Online</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #173b7a;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    .header-buttons a,
    .header-buttons button {
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
    }

    .home {
      background: white;
      color: #173b7a;
    }

    .logout {
      background: #e74c3c;
      color: white;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 14px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .student {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .student h3 {
      margin-top: 0;
      margin-bottom: 15px;
    }

    .student p {
      margin: 8px 0;
    }

    .access-row {
      margin-top: 16px;
    }

    .access-btn {
      border: none;
      padding: 11px 17px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .closed {
      background: #173b7a;
      color: white;
    }

    .open {
      background: #e74c3c;
      color: white;
    }

    .access-status {
      margin-top: 10px;
      font-weight: bold;
    }

    .status-open {
      color: #159447;
    }

    .status-closed {
      color: #777;
    }

    #status {
      padding: 20px;
      text-align: center;
    }

    @media (max-width: 650px) {
      header {
        padding: 15px;
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }

      header h2 {
        font-size: 18px;
      }

      main {
        padding: 0 15px;
      }
    }
  </style>
</head>

<body>

<header>

  <h2>⚙️ Kemenger Online — Админ панель</h2>

  <div class="header-buttons">

    <a class="home" href="index.html">
      Басты бет
    </a>

    <button class="logout" id="logoutBtn">
      Шығу
    </button>

  </div>

</header>


<main>

  <div class="welcome">

    <h2>Оқушыларды басқару</h2>

    <p>
      Оқушы сұраған сыныпқа доступты осы жерден ашып немесе жаба аласыз.
    </p>

  </div>

  <div id="status">
    Оқушылар жүктелуде...
  </div>

  <div id="students"></div>

</main>


<script type="module">

  import {
    initializeApp
  }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signOut
  }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc
  }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyADJAbETAdQNmwMLzWOZOpZ_6gSmHWVF-0",

    authDomain:
      "kemenger-online.firebaseapp.com",

    projectId:
      "kemenger-online",

    storageBucket:
      "kemenger-online.firebasestorage.app",

    messagingSenderId:
      "44270080959",

    appId:
      "1:44270080959:web:11378db65528a1a4e0470a",

    measurementId:
      "G-FMTYL770EJ"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  const ADMIN_EMAIL =
    "d.kuanyshbek11@mail.ru";


  const studentsDiv =
    document.getElementById("students");

  const status =
    document.getElementById("status");


  onAuthStateChanged(
    auth,
    async (user) => {

      if (!user) {

        window.location.href =
          "login.html";

        return;
      }


      if (
        !user.email ||
        user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
      ) {

        alert(
          "Бұл бөлімге тек администратор кіре алады."
        );

        window.location.href =
          "index.html";

        return;
      }


      await loadStudents();

    }
  );


  async function loadStudents() {

    try {

      status.textContent =
        "Оқушылар жүктелуде...";


      const snapshot =
        await getDocs(
          collection(db, "users")
        );


      studentsDiv.innerHTML = "";


      if (snapshot.empty) {

        status.textContent =
          "Әзірге оқушылар тіркелмеген.";

        return;
      }


      status.textContent = "";


      let studentCount = 0;


      snapshot.forEach(
        (studentDoc) => {

          const data =
            studentDoc.data();


          if (
            data.role === "admin" ||
            (
              data.email &&
              data.email.toLowerCase() ===
              ADMIN_EMAIL.toLowerCase()
            )
          ) {

            return;
          }


          studentCount++;


          const card =
            document.createElement("div");

          card.className =
            "student";


          const name =
            data.name ||
            data.fullName ||
            "Оқушы";


          const email =
            data.email ||
            "Көрсетілмеген";


          const phone =
            data.phone ||
            "Көрсетілмеген";


          const requestedClass =
            data.requestedClass
              ? String(data.requestedClass)
              : "";


          let accessHtml = "";


          if (requestedClass) {

            const field =
              "grade" + requestedClass;


            const hasAccess =
              data[field] === true;


            accessHtml = `

              <p>
                <b>Доступ сұраған сынып:</b>
                ${escapeHtml(requestedClass)}-сынып
              </p>


              <div class="access-status ${
                hasAccess
                  ? "status-open"
                  : "status-closed"
              }">

                ${
                  hasAccess
                    ? "✅ Доступ ашық"
                    : "🔒 Доступ жабық"
                }

              </div>


              <div class="access-row">

                <button
                  class="access-btn ${
                    hasAccess
                      ? "open"
                      : "closed"
                  }"
                  onclick="changeAccess(
                    '${studentDoc.id}',
                    '${field}',
                    ${!hasAccess}
                  )"
                >

                  ${
                    hasAccess
                      ? "🔒 Доступты ЖАБУ"
                      : "✅ Доступты АШУ"
                  }

                </button>

              </div>

            `;

          } else {

            accessHtml = `

              <p>
                <b>Доступ сұраған сынып:</b>
                Көрсетілмеген
              </p>

            `;

          }


          card.innerHTML = `

            <h3>
              👤 ${escapeHtml(name)}
            </h3>


            <p>
              <b>Email:</b>
              ${escapeHtml(email)}
            </p>


            <p>
              <b>Телефон:</b>
              ${escapeHtml(phone)}
            </p>


            ${accessHtml}

          `;


          studentsDiv.appendChild(
            card
          );

        }
      );


      if (studentCount === 0) {

        status.textContent =
          "Әзірге оқушылар тіркелмеген.";

      }

    } catch (error) {

      console.error(error);

      status.textContent =
        "Оқушыларды жүктеу кезінде қате шықты.";

    }

  }


  window.changeAccess =
    async function(
      uid,
      field,
      newValue
    ) {

      try {

        await updateDoc(
          doc(
            db,
            "users",
            uid
          ),
          {
            [field]: newValue
          }
        );


        await loadStudents();


      } catch (error) {

        console.error(error);

        alert(
          "Доступты өзгерту кезінде қате шықты."
        );

      }

    };


  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async () => {

        await signOut(auth);

        window.location.href =
          "login.html";

      }
    );


  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      String(text);

    return div.innerHTML;

  }

</script>

</body>
</html>
