<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Кіру — Kemenger Online</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #173b7a, #2d65c8);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      color: #173b7a;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #172033;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccd4e0;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2d65c8;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #173b7a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2d65c8;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #173b7a;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">Kemenger Online</div>
    <div class="subtitle">Жеке кабинетке кіру</div>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Email енгізіңіз"
        required
      >

      <label for="password">Құпия сөз</label>
      <input
        type="password"
        id="password"
        placeholder="Құпия сөзді енгізіңіз"
        required
      >

      <button type="submit">Кіру</button>

    </form>

    <div id="message"></div>

    <a class="back" href="index.html">← Басты бетке қайту</a>

  </div>


  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyADJAbETAdQNmwMLzWOZOpZ_6gSmHWVF-0",
      authDomain: "kemenger-online.firebaseapp.com",
      projectId: "kemenger-online",
      storageBucket: "kemenger-online.firebasestorage.app",
      messagingSenderId: "44270080959",
      appId: "1:44270080959:web:11378db65528a1a4e0470a",
      measurementId: "G-FMTYL770EJ"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");


    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      message.style.color = "#555";
      message.textContent = "Кіру орындалуда...";

      try {

        await signInWithEmailAndPassword(auth, email, password);

        message.style.color = "green";
        message.textContent = "Сәтті кірдіңіз!";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 700);

      } catch (error) {

        message.style.color = "red";

        if (error.code === "auth/invalid-credential") {
          message.textContent = "Email немесе құпия сөз қате.";
        } else if (error.code === "auth/invalid-email") {
          message.textContent = "Email дұрыс жазылмаған.";
        } else {
          message.textContent = "Кіру кезінде қате шықты.";
        }

      }

    });

  </script>

</body>
</html>
