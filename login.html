<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Кіру — Kemenger Online</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #173b7a, #2d65c8);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 450px;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      color: #173b7a;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #e9eef7;
      color: #173b7a;
    }

    .tab-btn.active {
      background: #173b7a;
      color: white;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #172033;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccd4e0;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #2d65c8;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #173b7a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #2d65c8;
    }

    #registerForm {
      display: none;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #173b7a;
      text-decoration: none;
    }

    .info {
      background: #f3f6fb;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      color: #555;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    /* ПАЙДАЛАНУШЫ КЕЛІСІМІ */

    .agreement-box {
      background: #f7f9fc;
      border: 1px solid #dce3ee;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .agreement-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.5;
      font-weight: normal;
    }

    .agreement-label input[type="checkbox"] {
      width: 20px;
      height: 20px;
      min-width: 20px;
      margin: 1px 0 0 0;
      padding: 0;
      cursor: pointer;
    }

    .agreement-label a {
      color: #173b7a;
      font-weight: bold;
      text-decoration: underline;
    }

    .agreement-label a:hover {
      color: #2d65c8;
    }

    @media (max-width: 500px) {

      .login-box {
        padding: 25px 20px;
      }

      .logo {
        font-size: 23px;
      }

    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">Kemenger Online</div>
    <div class="subtitle">Жеке кабинет</div>

    <div class="tabs">

      <button
        type="button"
        class="tab-btn active"
        id="loginTab"
      >
        Кіру
      </button>

      <button
        type="button"
        class="tab-btn"
        id="registerTab"
      >
        Тіркелу
      </button>

    </div>


    <!-- =========================
         КІРУ
    ========================== -->

    <form id="loginForm">

      <label for="loginEmail">
        Email
      </label>

      <input
        type="email"
        id="loginEmail"
        placeholder="Email енгізіңіз"
        required
      >


      <label for="loginPassword">
        Құпия сөз
      </label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Құпия сөзді енгізіңіз"
        required
      >


      <button
        type="submit"
        class="submit-btn"
      >
        Кіру
      </button>


      <div
        id="loginMessage"
        class="message"
      ></div>

    </form>



    <!-- =========================
         ТІРКЕЛУ
    ========================== -->

    <form id="registerForm">

      <div class="info">
        Тіркелгеннен кейін әкімші сіздің сұранысыңызды көреді.
        Төлем жасау үшін сіз көрсеткен нөмірге хабарлама жіберіледі
        (дұрыс нөмірді енгізуді сұраймыз).
        Төлем расталған соң қажетті сыныпқа доступ беріледі.
      </div>


      <label for="fullName">
        Аты-жөніңіз
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="Мысалы: Айбек Нұрланұлы"
        required
      >


      <label for="phone">
        Телефон нөмірі
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="+7 777 123 45 67"
        required
      >


      <label for="requestedClass">
        Қай сыныпқа доступ керек?
      </label>

      <select
        id="requestedClass"
        required
      >

        <option value="">
          Сыныпты таңдаңыз
        </option>

        <option value="5">
          5-сынып
        </option>

        <option value="6">
          6-сынып
        </option>

        <option value="7">
          7-сынып
        </option>

        <option value="8">
          8-сынып
        </option>

        <option value="9">
          9-сынып
        </option>

        <option value="10">
          10-сынып
        </option>

        <option value="11">
          11-сынып
        </option>

      </select>


      <label for="registerEmail">
        Email
      </label>

      <input
        type="email"
        id="registerEmail"
        placeholder="Email енгізіңіз"
        required
      >


      <label for="registerPassword">
        Құпия сөз
      </label>

      <input
        type="password"
        id="registerPassword"
        placeholder="Кемінде 6 таңба"
        minlength="6"
        required
      >


      <label for="confirmPassword">
        Құпия сөзді қайталаңыз
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Құпия сөзді қайта енгізіңіз"
        minlength="6"
        required
      >


      <!-- ПАЙДАЛАНУШЫ КЕЛІСІМІ -->

      <div class="agreement-box">

        <label class="agreement-label">

          <input
            type="checkbox"
            id="agreement"
          >

          <span>

            Мен

            <a
              href="agreement.html"
              target="_blank"
              rel="noopener noreferrer"
            >
              Пайдаланушы келісімімен
            </a>

            таныстым және оның шарттарымен келісемін.

          </span>

        </label>

      </div>


      <button
        type="submit"
        class="submit-btn"
      >
        Тіркелу
      </button>


      <div
        id="registerMessage"
        class="message"
      ></div>

    </form>


    <a
      class="back"
      href="index.html"
    >
      ← Басты бетке қайту
    </a>

  </div>



  <script type="module">

    /* =========================
       FIREBASE
    ========================= */

    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      signOut
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    import {
      getFirestore,
      doc,
      setDoc,
      runTransaction,
      serverTimestamp,
      Timestamp
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



    const firebaseConfig = {

      apiKey:
      "AIzaSyADJAbETAdQNmwMLzWOZOpZ_6gSmHWVF-0",

      authDomain:
      "kemenger-online.firebaseapp.com",

      projectId:
      "kemenger-online",

      storageBucket:
      "kemenger-online.firebasestorage.app",

      messagingSenderId:
      "44270080959",

      appId:
      "1:44270080959:web:11378db65528a1a4e0470a",

      measurementId:
      "G-FMTYL770EJ"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    /*
      АДМИН EMAIL
    */

    const ADMIN_EMAIL =
      "d.kuanyshbek11@mail.ru";


    await setPersistence(
      auth,
      browserLocalPersistence
    );



    /* =========================
       ҚҰРЫЛҒЫ ID
    ========================= */

    function getDeviceId() {

      let deviceId =
        localStorage.getItem(
          "kemenger_device_id"
        );


      if (!deviceId) {

        if (
          window.crypto &&
          crypto.randomUUID
        ) {

          deviceId =
            crypto.randomUUID();

        }

        else {

          deviceId =
            "device_" +
            Date.now() +
            "_" +
            Math.random()
            .toString(36)
            .substring(2, 12);

        }


        localStorage.setItem(
          "kemenger_device_id",
          deviceId
        );

      }


      return deviceId;

    }



    /* =========================
       ҚҰРЫЛҒЫ АТАУЫ
    ========================= */

    function getDeviceName() {

      const ua =
        navigator.userAgent || "";


      if (/iPhone/i.test(ua)) {

        return "iPhone";

      }


      if (/iPad/i.test(ua)) {

        return "iPad";

      }


      if (/Android/i.test(ua)) {

        return "Android";

      }


      if (/Windows/i.test(ua)) {

        return "Windows";

      }


      if (/Macintosh|Mac OS X/i.test(ua)) {

        return "Mac";

      }


      if (/Linux/i.test(ua)) {

        return "Linux";

      }


      return "Белгісіз құрылғы";

    }



    /* =========================
       БРАУЗЕР АТАУЫ
    ========================= */

    function getBrowserName() {

      const ua =
        navigator.userAgent || "";


      if (
        /Edg/i.test(ua)
      ) {

        return "Edge";

      }


      if (
        /CriOS|Chrome/i.test(ua) &&
        !/Edg/i.test(ua)
      ) {

        return "Chrome";

      }


      if (
        /FxiOS|Firefox/i.test(ua)
      ) {

        return "Firefox";

      }


      if (
        /Safari/i.test(ua) &&
        !/Chrome|CriOS|Edg/i.test(ua)
      ) {

        return "Safari";

      }


      return "Браузер";

    }



    /* =========================
       2 ҚҰРЫЛҒЫ ЛИМИТІ
    ========================= */

    async function registerDevice(user) {

      const deviceId =
        getDeviceId();

      const deviceName =
        getDeviceName();

      const browserName =
        getBrowserName();


      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      let userRole =
        "student";


      await runTransaction(
        db,
        async (transaction) => {

          const userSnap =
            await transaction.get(
              userRef
            );


          if (!userSnap.exists()) {

            throw new Error(
              "USER_DATA_NOT_FOUND"
            );

          }


          const data =
            userSnap.data();


          userRole =
            data.role || "student";


          /* АДМИНГЕ ШЕКТЕУ ЖОҚ */

          if (
            userRole === "admin"
          ) {

            return;

          }


          const devices =
            data.devices || {};


          const deviceIds =
            Object.keys(devices);


          /*
            БҰЛ ҚҰРЫЛҒЫ БҰРЫННАН
            ТІРКЕЛГЕН БОЛСА
          */

          if (
            devices[deviceId]
          ) {

            devices[deviceId] = {

              ...devices[deviceId],

              deviceName:
                deviceName,

              browser:
                browserName,

              lastLoginAt:
                Timestamp.now()

            };


            transaction.update(
              userRef,
              {
                devices: devices
              }
            );


            return;

          }


          /*
            2 ҚҰРЫЛҒЫ ТОЛЫП ТҰРСА
          */

          if (
            deviceIds.length >= 2
          ) {

            throw new Error(
              "DEVICE_LIMIT_REACHED"
            );

          }


          /*
            ЖАҢА ҚҰРЫЛҒЫНЫ
            ТІРКЕУ
          */

          devices[deviceId] = {

            deviceId:
              deviceId,

            deviceName:
              deviceName,

            browser:
              browserName,

            firstLoginAt:
              Timestamp.now(),

            lastLoginAt:
              Timestamp.now()

          };


          transaction.update(
            userRef,
            {
              devices: devices
            }
          );

        }
      );


      return userRole;

    }



    /* =========================
       ЭЛЕМЕНТТЕР
    ========================= */

    const loginTab =
      document.getElementById(
        "loginTab"
      );

    const registerTab =
      document.getElementById(
        "registerTab"
      );

    const loginForm =
      document.getElementById(
        "loginForm"
      );

    const registerForm =
      document.getElementById(
        "registerForm"
      );

    const loginMessage =
      document.getElementById(
        "loginMessage"
      );

    const registerMessage =
      document.getElementById(
        "registerMessage"
      );



    /* =========================
       TAB — КІРУ
    ========================= */

    loginTab.addEventListener(
      "click",
      () => {

        loginTab
        .classList
        .add("active");


        registerTab
        .classList
        .remove("active");


        loginForm.style.display =
          "block";


        registerForm.style.display =
          "none";


        loginMessage.textContent =
          "";


        registerMessage.textContent =
          "";

      }
    );



    /* =========================
       TAB — ТІРКЕЛУ
    ========================= */

    registerTab.addEventListener(
      "click",
      () => {

        registerTab
        .classList
        .add("active");


        loginTab
        .classList
        .remove("active");


        registerForm.style.display =
          "block";


        loginForm.style.display =
          "none";


        loginMessage.textContent =
          "";


        registerMessage.textContent =
          "";

      }
    );



    /* =========================
       КІРУ
    ========================= */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const email =
          document
          .getElementById(
            "loginEmail"
          )
          .value
          .trim();


        const password =
          document
          .getElementById(
            "loginPassword"
          )
          .value;


        loginMessage.style.color =
          "#555";


        loginMessage.textContent =
          "Кіру орындалуда...";


        try {

          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          /*
            АДМИНГЕ ҚҰРЫЛҒЫ ШЕКТЕУІ ЖОҚ

            ТЕК ОҚУШЫЛАРДЫҢ
            ҚҰРЫЛҒЫСЫ ТЕКСЕРІЛЕДІ
          */

          if (
            !user.email ||
            user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
          ) {

            await registerDevice(
              user
            );

          }


          loginMessage.style.color =
            "green";


          loginMessage.textContent =
            "Сәтті кірдіңіз!";


          setTimeout(
            () => {

              window.location.href =
                "index.html";

            },
            700
          );


        }

        catch (error) {

          console.error(error);


          /*
            ҮШІНШІ ҚҰРЫЛҒЫ
          */

          if (
            error.message ===
            "DEVICE_LIMIT_REACHED"
          ) {

            await signOut(auth);


            loginMessage.style.color =
              "red";


            loginMessage.innerHTML =
              "⛔ Бұл аккаунтқа 2 құрылғы тіркеліп қойған.<br><br>" +
              "Үшінші құрылғыдан кіруге рұқсат жоқ.<br>" +
              "Жаңа құрылғы қосу үшін әкімшіге хабарласыңыз.";


            return;

          }


          /*
            FIREBASE-ДА USER ҚҰЖАТЫ ЖОҚ
          */

          if (
            error.message ===
            "USER_DATA_NOT_FOUND"
          ) {

            await signOut(auth);


            loginMessage.style.color =
              "red";


            loginMessage.textContent =
              "Пайдаланушы мәліметтері табылмады.";


            return;

          }


          loginMessage.style.color =
            "red";


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            loginMessage.textContent =
              "Email немесе құпия сөз қате.";

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            loginMessage.textContent =
              "Email дұрыс жазылмаған.";

          }

          else if (
            error.code ===
            "permission-denied" ||
            error.code ===
            "firestore/permission-denied"
          ) {

            await signOut(auth);


            loginMessage.textContent =
              "Құрылғыны тексеруге Firebase рұқсат бермеді.";

          }

          else {

            loginMessage.textContent =
              "Кіру кезінде қате шықты.";

          }

        }

      }
    );



    /* =========================
       ТІРКЕЛУ
    ========================= */

    registerForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const fullName =
          document
          .getElementById(
            "fullName"
          )
          .value
          .trim();


        const phone =
          document
          .getElementById(
            "phone"
          )
          .value
          .trim();


        const requestedClass =
          document
          .getElementById(
            "requestedClass"
          )
          .value;


        const email =
          document
          .getElementById(
            "registerEmail"
          )
          .value
          .trim();


        const password =
          document
          .getElementById(
            "registerPassword"
          )
          .value;


        const confirmPassword =
          document
          .getElementById(
            "confirmPassword"
          )
          .value;


        const agreement =
          document
          .getElementById(
            "agreement"
          )
          .checked;



        /* =========================
           КЕЛІСІМ
        ========================= */

        if (!agreement) {

          registerMessage.style.color =
            "red";


          registerMessage.textContent =
            "Тіркелу үшін Пайдаланушы келісімімен келісуіңіз қажет.";


          return;

        }



        /* =========================
           ҚҰПИЯ СӨЗ
        ========================= */

        if (
          password !==
          confirmPassword
        ) {

          registerMessage.style.color =
            "red";


          registerMessage.textContent =
            "Құпия сөздер бірдей емес.";


          return;

        }



        if (
          password.length < 6
        ) {

          registerMessage.style.color =
            "red";


          registerMessage.textContent =
            "Құпия сөз кемінде 6 таңбадан тұруы керек.";


          return;

        }



        registerMessage.style.color =
          "#555";


        registerMessage.textContent =
          "Тіркелу орындалуда...";


        try {

          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          /*
            ТІРКЕЛГЕН ҚҰРЫЛҒЫ —
            1-ҚҰРЫЛҒЫ
          */

          const deviceId =
            getDeviceId();

          const deviceName =
            getDeviceName();

          const browserName =
            getBrowserName();


          const firstDevice = {};


          firstDevice[deviceId] = {

            deviceId:
              deviceId,

            deviceName:
              deviceName,

            browser:
              browserName,

            firstLoginAt:
              Timestamp.now(),

            lastLoginAt:
              Timestamp.now()

          };



          await setDoc(
            doc(
              db,
              "users",
              user.uid
            ),
            {

              uid:
                user.uid,

              name:
                fullName,

              fullName:
                fullName,

              phone:
                phone,

              email:
                email,

              role:
                "student",

              requestedClass:
                requestedClass,

              grade5:
                false,

              grade6:
                false,

              grade7:
                false,

              grade8:
                false,

              grade9:
                false,

              grade10:
                false,

              grade11:
                false,


              /* =========================
                 ҚҰРЫЛҒЫЛАР
              ========================= */

              devices:
                firstDevice,

              deviceLimit:
                2,


              /* =========================
                 ПАЙДАЛАНУШЫ КЕЛІСІМІ
              ========================= */

              termsAccepted:
                true,

              termsVersion:
                "1.0",

              termsAcceptedAt:
                serverTimestamp(),


              createdAt:
                serverTimestamp()

            }
          );


          registerMessage.style.color =
            "green";


          registerMessage.innerHTML =
            "Сәтті тіркелдіңіз!<br>" +
            "Сұранысыңыз әкімшіге жіберілді.";


          setTimeout(
            () => {

              window.location.href =
                "index.html";

            },
            1500
          );


        }

        catch (error) {

          console.error(error);


          registerMessage.style.color =
            "red";


          if (
            error.code ===
            "auth/email-already-in-use"
          ) {

            registerMessage.textContent =
              "Бұл Email бұрын тіркелген.";

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            registerMessage.textContent =
              "Email дұрыс жазылмаған.";

          }

          else if (
            error.code ===
            "auth/weak-password"
          ) {

            registerMessage.textContent =
              "Құпия сөз тым әлсіз.";

          }

          else if (
            error.code ===
            "permission-denied" ||
            error.code ===
            "firestore/permission-denied"
          ) {

            registerMessage.textContent =
              "Тіркелу жасалды, бірақ оқушы мәліметін сақтауға рұқсат жоқ.";

          }

          else {

            registerMessage.textContent =
              "Тіркелу кезінде қате шықты: " +
              (error.code || "Белгісіз қате");

          }

        }

      }
    );

  </script>

</body>
</html>
